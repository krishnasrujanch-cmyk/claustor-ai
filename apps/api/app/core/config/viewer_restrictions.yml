viewer_restricted_patterns:
  - name: GSTIN
    pattern: "[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]"
    replacement: "[ID Restricted - contact Admin]"
  - name: PAN
    pattern: "[A-Z]{5}[0-9]{4}[A-Z]"
    replacement: "[ID Restricted - contact Admin]"
  - name: TAN
    pattern: "[A-Z]{4}[0-9]{7}"
    replacement: "[ID Restricted - contact Admin]"
  - name: UK_VAT
    pattern: "GB[0-9]{9}"
    replacement: "[ID Restricted - contact Admin]"
  - name: EIN
    pattern: "[0-9]{2}-[0-9]{7}"
    replacement: "[ID Restricted - contact Admin]"
  - name: UEN
    pattern: "[0-9]{9}[A-Z]"
    replacement: "[ID Restricted - contact Admin]"
  - name: INR_AMOUNT
    pattern: "INR\\s*[\\d,]+(?:\\.\\d+)?(?:\\s*(?:lakh|crore|million|billion|L|Cr|M|B))?"
    replacement: "[Amount Restricted - contact Admin]"
  - name: USD_AMOUNT
    pattern: "USD\\s*[\\d,]+(?:\\.\\d+)?(?:\\s*(?:million|billion|M|B))?"
    replacement: "[Amount Restricted - contact Admin]"
  - name: IFSC
    pattern: "[A-Z]{4}0[A-Z0-9]{6}"
    replacement: "[Bank Detail Restricted]"
