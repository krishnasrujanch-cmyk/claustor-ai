country: GB
patterns:
  UK_VAT:
    regex: "\\b(GB\\s?[0-9]{9}(?:\\s?[0-9]{2,3})?)\\b"
    priority: 100
    validate: true
    normalize: remove_spaces
    description: "UK VAT Registration Number"
    label: "VAT"

  UK_CRN:
    regex: "\\b(?:Company\\s*(?:No|Number|Reg)[:.\\s]*)([0-9]{6,8}|[A-Z]{2}[0-9]{6})\\b"
    priority: 95
    validate: false
    normalize: uppercase
    description: "UK Companies House Registration Number"
    label: "Company No"

  UK_NINO:
    regex: "\\b(?:NI[:\\s]*)([A-Z]{2}[0-9]{6}[A-Z])\\b"
    priority: 80
    validate: false
    normalize: uppercase
    description: "National Insurance Number (business context only)"
    label: "NI"
