country: GLOBAL
patterns:
  ISO_CERT:
    regex: "\\b(ISO\\s?[0-9]{4,5}(?::[0-9]{4})?)\\b"
    priority: 60
    validate: false
    normalize: remove_spaces
    description: "ISO Certification Number"
    label: "ISO"

  IBAN:
    regex: "\\b([A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}(?:[A-Z0-9]{0,16}))\\b"
    priority: 95
    validate: true
    normalize: remove_spaces
    description: "International Bank Account Number"
    label: "IBAN"

  SWIFT:
    regex: "\\b([A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?)\\b"
    priority: 90
    validate: false
    normalize: uppercase
    description: "SWIFT/BIC Code"
    label: "SWIFT"

  REG_NO:
    regex: "\\b(?:Reg(?:istration)?[.:\\s#]*No[.:\\s]*)([A-Z0-9/-]{5,20})\\b"
    priority: 50
    validate: false
    normalize: uppercase
    description: "Generic Registration Number"
    label: "Reg No"

  LICENSE_NO:
    regex: "\\b(?:License|Licence)\\s*(?:No|Number)[.:\\s]*([A-Z0-9/-]{5,20})\\b"
    priority: 50
    validate: false
    normalize: uppercase
    description: "Generic License Number"
    label: "License No"
