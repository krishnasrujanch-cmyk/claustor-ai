country: AU
patterns:
  AU_ABN:
    regex: "\\b(?:ABN[:\\s]*)([0-9]{2}\\s?[0-9]{3}\\s?[0-9]{3}\\s?[0-9]{3})\\b"
    priority: 100
    validate: true
    normalize: digits_only
    description: "Australian Business Number"
    label: "ABN"

  AU_ACN:
    regex: "\\b(?:ACN[:\\s]*)([0-9]{3}\\s?[0-9]{3}\\s?[0-9]{3})\\b"
    priority: 95
    validate: false
    normalize: digits_only
    description: "Australian Company Number"
    label: "ACN"
